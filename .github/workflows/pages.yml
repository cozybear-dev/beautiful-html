# Builds the site of example reports on every push to main, and publishes it
# with GitHub Pages when the repository variable PUBLISH_PAGES is "true".
# A site published this way is public, even when the repository is private.
name: Example site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The kits are committed, so nothing is installed. The runner's Chrome makes the pictures and the PDFs.
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: vars.PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
